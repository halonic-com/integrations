id: model-gemini
version: 0.1.0
kit: 1
provides: [llm]

hosts:
  - generativelanguage.googleapis.com

secrets:
  gemini-key:
    purpose: Your Gemini API key from Google AI Studio. Sent to Google with every model call.
    hosts: [generativelanguage.googleapis.com]
    # A header, never `?key=` in the URL: a URL can end up in logs and recordings.
    as: header
    header: x-goog-api-key

tokens: []
tools: []
needs: []

limits:
  # Without streaming, generateContent sends its response headers only once
  # the whole answer is done, so a long answer would hit the default 30 s
  # headers timeout. Allow it the full 10 minutes the kit allows overall.
  # The field name follows the kit and may still change in the sheet.
  headersTimeoutMs: 600000

recording:
  userContent:
    - request.body.systemInstruction.parts[*].text
    - request.body.contents[*].parts[*].text # what the user and the model wrote, the model's thoughts too
    # Tool arguments and results: every value, nested ones too. The argument
    # names stay; they are the tool's own, already in its schema.
    - request.body.contents[*].parts[*].functionCall.args.*
    - request.body.contents[*].parts[*].functionResponse.response.*
    - request.body.tools[*].functionDeclarations[*].description # can describe the user's own setup
    - response.body.candidates[*].content.parts[*].text
    - response.body.candidates[*].content.parts[*].functionCall.args.*
