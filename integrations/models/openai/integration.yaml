id: model-openai
version: 0.1.0
kit: 1
provides: [llm]

hosts:
  - api.openai.com

secrets:
  openai-key:
    purpose: Your OpenAI API key. Sent to OpenAI with every model call.
    hosts: [api.openai.com]
    as: bearer

tokens: []
tools: []
needs: []

limits:
  # `chat` doesn't stream, and then Chat Completions sends its response
  # headers only once the whole answer is done, so a long answer would hit
  # the default 30 s headers timeout. Allow it the full 10 minutes the kit
  # allows overall. `stream` gets its headers at once and doesn't need it,
  # but the sheet has one limit for both. The field name follows the kit and
  # may still change in the sheet.
  headersTimeoutMs: 600000

recording:
  userContent:
    - request.body.messages[*].content # what the user and the model wrote, and tool results
    - request.body.messages[*].tool_calls[*].function.arguments # tool arguments sent back
    - request.body.tools[*].function.description # can describe the user's own setup
    - response.body.choices[*].message.content
    - response.body.choices[*].message.refusal
    - response.body.choices[*].message.tool_calls[*].function.arguments
    # The same content in a streamed answer: each chunk's data.
    - response.body[*].data.choices[*].delta.content
    - response.body[*].data.choices[*].delta.refusal
    # Pieces of a tool's arguments. Each piece becomes a placeholder, so a
    # streamed tool call doesn't replay yet: see the README.
    - response.body[*].data.choices[*].delta.tool_calls[*].function.arguments
