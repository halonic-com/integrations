id: knowledge-mcp
version: 0.1.0
kit: 1 # the version of the Integration port it was built against
provides: [knowledge]

# The one MCP server the workspace chooses: the host of the `url` setting,
# and nothing else.
hosts:
  - fromSetting: url

secrets:
  mcp-server-key:
    purpose: >-
      The key for the MCP server you choose, if it needs one. Sent only to
      that server, never anywhere else.
    hosts:
      - fromSetting: url
    as: bearer

tokens: []
tools: [] # a knowledge source only: agents search it, they don't call tools
needs: []

# Not settled yet: the knowledge port has no `untrusted` field, so the sheet
# says it here. Every hit and every document is the server's text, so
# Halonic must fence it off like the result of an untrusted tool.
knowledge:
  untrusted: true

# Fields that hold the user's own content, for the recorder. The search
# query and the ref go out as tool arguments; the documents come back as
# the tool's text, in a JSON answer or in the events of an event stream.
recording:
  userContent:
    - request.body.params.arguments
    - response.body.result.content[*].text
    - response.body.result.structuredContent
    - response.body[*].data.result.content[*].text
    - response.body[*].data.result.structuredContent
